name: Build Multiple LLVM Versions

on:
  workflow_dispatch:
    inputs:
      versions:
        description: 'LLVM versions to build (comma-separated, e.g. 17.0.6,18.1.8,19.1.0,22.1.8)'
        required: true
        default: '17.0.6,18.1.8,19.1.0,22.1.8'
      enable_pgo:
        description: 'Enable PGO build'
        type: boolean
        default: false
      enable_bolt:
        description: 'Enable BOLT optimization'
        type: boolean
        default: false
      preset:
        description: 'Build preset: slim (free runner, fast), kernel (PGO+BOLT, needs big disk)'
        default: 'slim'
      release:
        description: 'Publish to GitHub Releases'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  parse-versions:
    name: Parse versions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - name: Parse version list
        id: set
        env:
          VERSIONS: ${{ github.event.inputs.versions }}
        run: |
          # Convert comma-separated to JSON array
          MATRIX=$(echo "$VERSIONS" | jq -Rc 'split(",") | map(select(length > 0))')
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
          echo "Versions: $MATRIX"

  build-matrix:
    name: Build LLVM ${{ matrix.llvm_version }}
    needs: parse-versions
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        llvm_version: ${{ fromJson(needs.parse-versions.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set version info
        id: version
        env:
          LLVM_VERSION: ${{ matrix.llvm_version }}
        run: |
          VERSION="$LLVM_VERSION"
          echo "llvm_branch=llvmorg-${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=${VERSION}" >> $GITHUB_OUTPUT
          echo "Building LLVM ${VERSION}"

      - name: Set output directory
        env:
          WORKSPACE: ${{ github.workspace }}
        run: echo "OUTPUT_DIR=$WORKSPACE/output" >> $GITHUB_ENV

      - name: Free up disk space
        run: |
          echo "=== Freeing disk space ==="
          sudo rm -rf /usr/share/dotnet /usr/share/swift /opt/ghc \
            /usr/local/share/powershell /usr/local/share/boost \
            /usr/local/lib/android /usr/local/lib/node_modules \
            /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache/Python \
            /opt/hostedtoolcache/Ruby /opt/hostedtoolcache/Go \
            /opt/hostedtoolcache/Java /opt/hostedtoolcache/PHP \
            /usr/share/miniconda /usr/local/lib/R /usr/local/.ghcup \
            /usr/local/julia* /usr/local/texlive /usr/share/az_* \
            /opt/az /opt/microsoft /opt/mssql /usr/share/kotlinc \
            /usr/local/share/gradle* /usr/local/share/sbt \
            /usr/local/graalvm /usr/local/lib/android \
            /usr/local/share/vcpkg
          sudo apt-get purge -y azure-cli google-cloud-sdk \
            google-cloud-cli google-chrome-stable microsoft-edge-stable \
            firefox mono-devel msbuild libmono-* &>/dev/null || true
          sudo apt-get autoremove -y &>/dev/null || true
          docker rmi $(docker images -q) 2>/dev/null || true
          sudo rm -rf /var/lib/docker
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/* /tmp/* /var/tmp/*
          sudo rm -rf /usr/share/doc /usr/share/man /usr/share/locale /usr/share/info
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build python3 git curl unzip \
            clang lld ccache \
            libxml2-dev libedit-dev libncurses-dev \
            libc++-dev libc++abi-dev libc6-dev \
            zstd build-essential ca-certificates

      - name: Setup ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-ccache-${{ matrix.llvm_version }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-ccache-${{ matrix.llvm_version }}-
            ${{ runner.os }}-ccache-

      - name: Count patches
        run: echo "PATCH_COUNT=$(ls -1 patches/*.patch 2>/dev/null | wc -l)" >> "$GITHUB_ENV"

      - name: Notify build started
        env:
          LLVM_BRANCH: ${{ steps.version.outputs.llvm_branch }}
          ENABLE_PGO: ${{ inputs.enable_pgo }}
          ENABLE_BOLT: ${{ inputs.enable_bolt }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: bash scripts/notify.sh started

      - name: Run build
        env:
          LLVM_BRANCH: ${{ steps.version.outputs.llvm_branch }}
          PRESET: ${{ inputs.preset }}
          ENABLE_PGO: ${{ inputs.enable_pgo }}
          ENABLE_BOLT: ${{ inputs.enable_bolt }}
          ZSTD_LEVEL: 10
        run: |
          bash scripts/build.sh

      - name: Run toolchain health check
        run: bash scripts/toolchain-check.sh "$HOME/toolchains/oronyx"

      - name: Strip toolchain (slim)
        run: |
          SLIM_ARGS=()
          if [[ "${SLIM_AGGRESSIVE:-false}" == "true" ]]; then
            SLIM_ARGS+=(--aggressive)
          fi
          if [[ "${SLIM_TOOLCHAIN:-true}" == "true" ]]; then
            bash scripts/toolchain-slim.sh "$HOME/toolchains/oronyx" "${SLIM_ARGS[@]}"
          else
            echo "Slim disabled by preset"
          fi

      - name: Package toolchain
        id: package
        run: bash scripts/package.sh
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          ZSTD_LEVEL: 10

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: oronyx-clang-${{ matrix.llvm_version }}
          path: |
            ${{ env.OUTPUT_DIR }}/oronyx-clang-*.tar.zst
            ${{ env.OUTPUT_DIR }}/clang-version.txt
          retention-days: 30

      - name: Publish release
        if: inputs.release == true
        env:
          GH_TOKEN: ${{ github.token }}
          TARBALL: ${{ steps.package.outputs.TARBALL }}
          LLVM_VERSION: ${{ matrix.llvm_version }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          OUTPUT_DIR: ${{ env.OUTPUT_DIR }}
        run: |
          # Try create first; if tag exists, delete and retry
          gh release create "$LLVM_VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Oronyx Clang $LLVM_VERSION" \
            --notes "Oronyx Clang build for LLVM $LLVM_VERSION" \
            "$TARBALL" \
            "$OUTPUT_DIR/clang-version.txt" 2>/dev/null || {
            echo "Tag exists — deleting old release and retrying..."
            gh release delete "$LLVM_VERSION" --repo "$GITHUB_REPOSITORY" --yes 2>/dev/null || true
            git push --delete origin "$LLVM_VERSION" 2>/dev/null || true

            gh release create "$LLVM_VERSION" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Oronyx Clang $LLVM_VERSION" \
              --notes "Oronyx Clang build for LLVM $LLVM_VERSION" \
              "$TARBALL" \
              "$OUTPUT_DIR/clang-version.txt"
          }

      - name: Notify build success
        if: success()
        env:
          CLANG_VERSION: ${{ steps.package.outputs.CLANG_VERSION }}
          RELEASE_TAG: ${{ matrix.llvm_version }}
          LLVM_BRANCH: ${{ steps.version.outputs.llvm_branch }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: bash scripts/notify.sh success

      - name: Notify release
        if: inputs.release == true && success()
        env:
          RELEASE_TAG: ${{ matrix.llvm_version }}
          CLANG_VERSION: ${{ steps.package.outputs.CLANG_VERSION }}
          TARBALL_NAME: ${{ env.TARBALL_NAME }}
          PACKAGE_SIZE: ${{ env.PACKAGE_SIZE }}
          SHA256: ${{ env.SHA256 }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: bash scripts/notify.sh release

      - name: Notify build failure
        if: failure()
        env:
          LLVM_BRANCH: ${{ steps.version.outputs.llvm_branch }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: bash scripts/notify.sh failure
