name: Build OronyxClang

on:
  schedule:
    - cron: '0 0 * * *'  # Daily at midnight UTC
  workflow_dispatch:
    inputs:
      llvm_branch:
        description: 'LLVM branch or tag (e.g. llvmorg-22.1.8, main)'
        default: 'llvmorg-22.1.8'
        required: true
      enable_pgo:
        description: 'Enable 2-stage PGO build'
        type: boolean
        default: false
      pgo_workload:
        description: 'PGO workload type (sqlite=fast, kernel=accurate)'
        default: 'sqlite'
      enable_bolt:
        description: 'Enable BOLT post-build optimization'
        type: boolean
        default: false
      llvm_source:
        description: 'LLVM source: upstream (GitHub) or android (AOSP fork)'
        default: 'upstream'
      release:
        description: 'Publish to GitHub Releases'
        type: boolean
        default: true

  repository_dispatch:
    types: [new-llvm-release]
    inputs:
      llvm_branch:
        description: 'New LLVM tag to build'
        required: true

  push:
    paths:
      - 'patches/**'
      - 'scripts/**'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}

env:
  # Schedule builds track main branch (rolling); dispatch can override
  LLVM_BRANCH: ${{ github.event.inputs.llvm_branch || github.event.client_payload.llvm_branch || 'main' }}
  LLVM_SOURCE: ${{ github.event.inputs.llvm_source || 'upstream' }}
  ENABLE_PGO: ${{ github.event.inputs.enable_pgo || 'false' }}
  ENABLE_BOLT: ${{ github.event.inputs.enable_bolt || 'false' }}
  PGO_WORKLOAD: ${{ github.event.inputs.pgo_workload || 'sqlite' }}
  INSTALL_DIR: ${{ github.workspace }}/toolchain
  BUILD_DIR: ${{ github.workspace }}/build
  LLVM_DIR: ${{ github.workspace }}/llvm-project
  OUTPUT_DIR: ${{ github.workspace }}/output
  RELEASE_TAG: oronyx-placeholder
  ZSTD_LEVEL: 10

jobs:
  build:
    name: Build OronyxClang
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 360

    steps:
      # ── Prep ────────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set LLVM branch from .llvm-version for scheduled/push builds
        if: github.event_name == 'schedule' || github.event_name == 'push'
        run: |
          BRANCH=$(cat .llvm-version 2>/dev/null | tr -d '[:space:]')
          echo "LLVM_BRANCH=${BRANCH}" >> "$GITHUB_ENV"
          echo "Using stable branch: ${BRANCH}"

      - name: Set release tag from LLVM branch
        run: |
          BRANCH="${{ env.LLVM_BRANCH }}"
          if [[ "$BRANCH" == "main" ]]; then
            VERSION="rolling"
          else
            # llvmorg-22.1.8 → 22.1.8, llvmorg-22.1.8-rc1 → 22.1.8-rc1
            VERSION=$(echo "$BRANCH" | sed 's/^llvmorg-//')
          fi
          echo "RELEASE_TAG=${VERSION}" >> "$GITHUB_ENV"
          echo "ORONYX_VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "Release tag: ${VERSION}"

      - name: Validate release tag
        if: env.RELEASE_TAG == 'oronyx-placeholder'
        run: |
          echo "RELEASE_TAG was not properly set — failing early"
          exit 1

      - name: Count patches
        run: echo "PATCH_COUNT=$(ls -1 patches/*.patch 2>/dev/null | wc -l)" >> "$GITHUB_ENV"

      - name: Notify build started
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: bash scripts/notify.sh started

      - name: Free up disk space
        run: |
          echo "BUILD_STAGE=Freeing disk space" >> "$GITHUB_ENV"
          echo "=== Initial disk usage ==="
          df -h /
          echo "=== Removing runner diagnostic logs ==="
          rm -rf /home/runner/actions-runner/cached/*/_diag/*.log 2>/dev/null || true
          rm -rf /home/runner/actions-runner/_diag/*.log 2>/dev/null || true

          echo "=== Removing large pre-installed packages ==="
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/share/swift \
            /opt/ghc \
            /usr/local/share/powershell \
            /usr/local/share/boost \
            "$AGENT_TOOLSDIRECTORY" \
            /usr/local/lib/android \
            /usr/local/lib/node_modules \
            /opt/hostedtoolcache/CodeQL \
            /opt/hostedtoolcache/Python \
            /opt/hostedtoolcache/Ruby \
            /opt/hostedtoolcache/Go \
            /opt/hostedtoolcache/Java \
            /opt/hostedtoolcache/PHP \
            /opt/hostedtoolcache/Boost \
            /opt/hostedtoolcache/CMake \
            /opt/hostedtoolcache/Miniconda \
            /opt/hostedtoolcache/PyPy \
            /usr/local/lib/heroku \
            /usr/local/share/chromium \
            /usr/share/miniconda \
            /usr/local/lib/R \
            /usr/local/.ghcup \
            /usr/local/julia* \
            /usr/local/texlive \
            /usr/share/az_* \
            /opt/az \
            /opt/microsoft \
            /opt/mssql \
            /usr/share/kotlinc \
            /usr/local/share/gradle* \
            /usr/local/share/sbt \
            /usr/local/share/powershell \
            /usr/local/graalvm \
            /usr/local/lib/android \
            /usr/local/share/vcpkg

          echo "=== Removing home caches ==="
          rm -rf /home/runner/.cache 2>/dev/null || true
          rm -rf /home/runner/.npm 2>/dev/null || true
          rm -rf /home/runner/.cargo 2>/dev/null || true
          rm -rf /home/runner/.dotnet 2>/dev/null || true
          rm -rf /home/runner/.rustup 2>/dev/null || true
          rm -rf /home/runner/.local/share 2>/dev/null || true
          rm -rf /home/runner/go 2>/dev/null || true

          echo "=== Purging large apt packages ==="
          sudo apt-get purge -y \
            azure-cli \
            google-cloud-sdk \
            google-cloud-cli \
            google-chrome-stable \
            microsoft-edge-stable \
            firefox \
            mono-devel \
            msbuild \
            libmono-* \
            &>/dev/null || true
          sudo apt-get autoremove -y &>/dev/null || true

          echo "=== Removing Docker images ==="
          docker rmi $(docker images -q) 2>/dev/null || true
          sudo rm -rf /var/lib/docker

          echo "=== Removing apt caches ==="
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

          echo "=== Removing snap packages ==="
          sudo snap list --no-legend 2>/dev/null | awk '{print $1}' | xargs -I{} sudo snap remove --purge {} 2>/dev/null || true

          echo "=== Removing temp files ==="
          sudo rm -rf /tmp/* /var/tmp/*

          echo "=== Removing doc/locale (saves ~1GB) ==="
          sudo rm -rf /usr/share/doc /usr/share/man /usr/share/locale /usr/share/info 2>/dev/null || true
          sudo rm -rf /usr/local/share/doc /usr/local/share/man 2>/dev/null || true

          echo "=== Removing leftover swap/hibernation ==="
          sudo swapoff -a 2>/dev/null || true
          sudo rm -f /swapfile /swap.img 2>/dev/null || true

          echo "=== Removing large logs ==="
          sudo find /var/log -type f -name "*.log" -mtime +1 -exec truncate -s 0 {} \; 2>/dev/null || true
          sudo journalctl --rotate --vacuum-time=1s 2>/dev/null || true

          echo "=== Removing more system packages to free space ==="
          sudo rm -rf /usr/local/lib/android 2>/dev/null || true
          sudo rm -rf /opt/hostedtoolcache 2>/dev/null || true
          sudo rm -rf /usr/local/lib/node_modules 2>/dev/null || true
          sudo rm -rf /usr/local/lib/heroku 2>/dev/null || true
          sudo rm -rf /usr/local/share/vcpkg 2>/dev/null || true
          sudo rm -rf /usr/local/share/chromium 2>/dev/null || true
          sudo rm -rf /usr/local/julia* 2>/dev/null || true
          sudo rm -rf /usr/local/texlive 2>/dev/null || true
          sudo rm -rf /usr/local/graalvm 2>/dev/null || true
          sudo rm -rf /usr/local/lib/R 2>/dev/null || true
          sudo rm -rf /usr/local/.ghcup 2>/dev/null || true
          sudo rm -rf /usr/share/miniconda 2>/dev/null || true
          sudo rm -rf /usr/share/kotlinc 2>/dev/null || true
          sudo rm -rf /usr/local/share/gradle* 2>/dev/null || true
          sudo rm -rf /usr/local/share/sbt 2>/dev/null || true
          sudo rm -rf /usr/local/share/powershell 2>/dev/null || true
          sudo rm -rf /usr/share/az_* 2>/dev/null || true
          sudo rm -rf /opt/az 2>/dev/null || true
          sudo rm -rf /opt/microsoft 2>/dev/null || true
          sudo rm -rf /opt/mssql 2>/dev/null || true

          echo "=== Removing /usr/local/lib subdirectories ==="
          sudo rm -rf /usr/local/lib/android 2>/dev/null || true
          sudo rm -rf /usr/local/lib/heroku 2>/dev/null || true
          sudo rm -rf /usr/local/lib/node_modules 2>/dev/null || true

          echo "=== Removing /usr/local/bin non-essential ==="
          sudo rm -f /usr/local/bin/node /usr/local/bin/npm /usr/local/bin/npx 2>/dev/null || true
          sudo rm -f /usr/local/bin/pip /usr/local/bin/pip3 2>/dev/null || true
          sudo rm -f /usr/local/bin/gradle /usr/local/bin/mvn 2>/dev/null || true

          echo "=== Resize ccache to minimum ==="
          ccache --set-config=max_size=500M 2>/dev/null || true

          echo "=== Final disk usage ==="
          df -h /

      - name: Install build dependencies
        run: |
          echo "BUILD_STAGE=Installing dependencies" >> "$GITHUB_ENV"
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build python3 git curl unzip \
            clang lld ccache \
            libxml2-dev libedit-dev libncurses-dev \
            libc++-dev libc++abi-dev \
            libc6-dev \
            zstd build-essential ca-certificates \
            binutils-aarch64-linux-gnu

      - name: Setup ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-ccache-${{ env.LLVM_BRANCH }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-ccache-${{ env.LLVM_BRANCH }}-
            ${{ runner.os }}-ccache-

      - name: Configure ccache
        run: |
          mkdir -p ~/.cache/ccache
          ccache --set-config=max_size=500M
          ccache -s

      - name: Cache LLVM source
        id: cache-llvm
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/llvm-project
          key: llvm-source-${{ env.LLVM_BRANCH }}-${{ hashFiles('patches/*.patch') }}
          restore-keys: |
            llvm-source-${{ env.LLVM_BRANCH }}-
            llvm-source-

      - name: Trim LLVM git cache after restore
        if: steps.cache-llvm.outputs.cache-hit == 'true'
        run: |
          if [[ -d "${{ github.workspace }}/llvm-project/.git" ]]; then
            echo "Pruning LLVM git objects to save disk space ..."
            git -C "${{ github.workspace }}/llvm-project" gc --aggressive --prune=now 2>/dev/null || true
            git -C "${{ github.workspace }}/llvm-project" reflog expire --expire=now --all 2>/dev/null || true
            rm -rf "${{ github.workspace }}/llvm-project/.git/refs/remotes" 2>/dev/null || true
            rm -rf "${{ github.workspace }}/llvm-project/.git/logs" 2>/dev/null || true
            rm -rf "${{ github.workspace }}/llvm-project/.git/hooks" 2>/dev/null || true
            rm -rf "${{ github.workspace }}/llvm-project/.git/info" 2>/dev/null || true
            rm -rf "${{ github.workspace }}/llvm-project/.git/rr-cache" 2>/dev/null || true
            rm -rf "${{ github.workspace }}/llvm-project/.git/merge/head" 2>/dev/null || true
            echo "After git prune:"
            du -sh "${{ github.workspace }}/llvm-project/.git" 2>/dev/null || true
          fi

      # ── Build ────────────────────────────────────────────────────────────────
      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Run build
        run: |
          echo "BUILD_STAGE=Running build" >> "$GITHUB_ENV"
          bash scripts/build.sh
        env:
          JOBS: 4
          LLVM_BRANCH: ${{ env.LLVM_BRANCH }}
          ENABLE_PGO: ${{ env.ENABLE_PGO }}
          ENABLE_BOLT: ${{ env.ENABLE_BOLT }}
          PGO_WORKLOAD: ${{ env.PGO_WORKLOAD }}
          ZSTD_LEVEL: 10

      - name: Show ccache stats
        run: ccache -s

      # ── Verify ──────────────────────────────────────────────────────────────
      - name: Run toolchain health check
        run: bash scripts/toolchain-check.sh "$INSTALL_DIR"

      # ── Collect build info (before cleanup) ──────────────────────────────────
      - name: Collect build info
        run: |
          echo "BUILD_STAGE=Collecting build info" >> "$GITHUB_ENV"
          # Save LLVM commit BEFORE we delete the source
          LLVM_COMMIT_HASH=$(git -C "$LLVM_DIR" rev-parse --short HEAD 2>/dev/null || echo "unknown")
          LLVM_COMMIT_FULL=$(git -C "$LLVM_DIR" rev-parse HEAD 2>/dev/null || echo "unknown")
          echo "LLVM_COMMIT_HASH=${LLVM_COMMIT_HASH}" >> "$GITHUB_ENV"
          echo "LLVM_COMMIT_FULL=${LLVM_COMMIT_FULL}" >> "$GITHUB_ENV"
          echo "LLVM_COMMIT=${LLVM_COMMIT_HASH}" >> "$GITHUB_ENV"

          CLANG_VERSION=$("$INSTALL_DIR/bin/clang" --version | head -1)
          echo "CLANG_VERSION=${CLANG_VERSION}" >> "$GITHUB_ENV"
          echo "Clang: ${CLANG_VERSION}"
          echo "Commit: ${LLVM_COMMIT_HASH}"

      - name: Generate LLVM changelog
        run: |
          PREV_LLVM=$(cat .llvm-version 2>/dev/null || echo "")
          LLVM_TAG="${{ env.LLVM_BRANCH }}"
          if [[ -n "$PREV_LLVM" && -d "$LLVM_DIR/.git" ]]; then
            echo "Generating changelog: ${PREV_LLVM} → ${LLVM_TAG}"
            bash scripts/llvm-changelog.sh "$LLVM_DIR" "$PREV_LLVM" "$LLVM_TAG" \
              > /tmp/llvm_changelog.md 2>&1 || \
              echo "Changelog generation failed, skipping" > /tmp/llvm_changelog.md
          else
            echo "No previous LLVM version to compare" > /tmp/llvm_changelog.md
          fi

      # ── Package ──────────────────────────────────────────────────────────────
      - name: Strip toolchain (slim)
        run: |
          SLIM_ARGS=()
          if [[ "${SLIM_AGGRESSIVE:-false}" == "true" ]]; then
            SLIM_ARGS+=(--aggressive)
          fi
          if [[ "${SLIM_TOOLCHAIN:-true}" == "true" ]]; then
            bash scripts/toolchain-slim.sh "$INSTALL_DIR" "${SLIM_ARGS[@]}"
          else
            echo "Slim disabled by preset"
          fi

      - name: Free up space after build
        run: |
          echo "=== Disk usage after build ==="
          df -h /
          echo "=== Cleaning up build artifacts ==="
          rm -rf "$GITHUB_WORKSPACE/build" 2>/dev/null || true
          rm -rf "$GITHUB_WORKSPACE/llvm-project" 2>/dev/null || true
          rm -rf ~/.cache/ccache 2>/dev/null || true
          sudo apt-get clean 2>/dev/null || true
          sudo rm -rf /var/lib/apt/lists/*
          sudo journalctl --rotate --vacuum-time=1s 2>/dev/null || true
          echo "=== Disk usage after cleanup ==="
          df -h /
      - name: Package toolchain + generate manifest
        id: package
        run: |
          echo "BUILD_STAGE=Packaging toolchain" >> "$GITHUB_ENV"
          bash scripts/package.sh
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          ZSTD_LEVEL: ${{ env.ZSTD_LEVEL }}

      - name: Show disk usage after build
        run: df -h

      # ── Upload artifact ──────────────────────────────────────────────────────
      - name: Upload toolchain artifact
        uses: actions/upload-artifact@v4
        with:
          name: oronyx-clang-${{ env.ORONYX_VERSION }}
          path: |
            ${{ env.OUTPUT_DIR }}/oronyx-clang-*.tar.zst
            ${{ env.OUTPUT_DIR }}/clang-version.txt
            get_latest_url.sh
            latest.txt
          retention-days: 7

      # ── Release ──────────────────────────────────────────────────────────────
      - name: Set release stage
        if: ${{ github.event.inputs.release == 'true' || github.event_name == 'repository_dispatch' || github.event_name == 'push' || github.event_name == 'schedule' }}
        run: echo "BUILD_STAGE=Publishing Release" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        if: ${{ github.event.inputs.release == 'true' || github.event_name == 'repository_dispatch' || github.event_name == 'push' || github.event_name == 'schedule' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TARBALL: ${{ steps.package.outputs.TARBALL }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
          CLANG_VERSION: ${{ env.CLANG_VERSION }}
          LLVM_COMMIT_HASH: ${{ env.LLVM_COMMIT_HASH }}
          BUILD_MODE: ${{ env.BUILD_MODE }}
          PATCH_COUNT: ${{ env.PATCH_COUNT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TARBALL_NAME: ${{ steps.package.outputs.TARBALL_NAME }}
          SHA256: ${{ env.SHA256 }}
        run: |
          # Build release body with placeholders, then substitute
          cat > /tmp/release_body.md << 'BODYEOF'
          ## Oronyx Clang @@RELEASE_TAG@@

          | | |
          |---|---|
          | **Clang** | @@CLANG_VERSION@@ |
          | **LLVM** | [llvm-project@@LLVM_COMMIT_HASH@@](https://github.com/llvm/llvm-project/commit/@@LLVM_COMMIT_HASH@@) |
          | **Build Mode** | @@BUILD_MODE@@ · LTO=Thin |
          | **Targets** | AArch64 · ARM |
          | **Patches** | @@PATCH_COUNT@@ |
          | **SHA256** | `@@SHA256@@` |

          ---

          ### Quick Install

          ```bash
          bash <(wget -qO- https://raw.githubusercontent.com/@@REPO@@/main/get_clang.sh)
          ```

          ### Manual Install

          ```bash
          wget "https://github.com/@@REPO@@/releases/download/@@RELEASE_TAG@@/@@TARBALL_NAME@@"
          tar -I zstd -xf @@TARBALL_NAME@@ -C ~/toolchains/
          export PATH="$HOME/toolchains/oronyx/bin:$PATH"
          ```

          ### Kernel Build

          ```bash
          export PATH="$HOME/toolchains/oronyx/bin:$PATH"

          make -j$(nproc) \
            O=out \
            ARCH=arm64 \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            STRIP=llvm-strip \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump
          ```

          @@CHANGELOG_SECTION@@

          ---

          **Features:** PGO · ThinLTO · BOLT · Polly · Device Presets · KernelSU · Kernel 4.14+ · AArch64/ARM

          Signed-off-by: OronyxCI <OronyxCI@users.noreply.github.com>
          BODYEOF

          sed -i "s|@@RELEASE_TAG@@|${RELEASE_TAG}|g" /tmp/release_body.md
          sed -i "s|@@CLANG_VERSION@@|${CLANG_VERSION}|g" /tmp/release_body.md
          sed -i "s|@@LLVM_COMMIT_HASH@@|${LLVM_COMMIT_HASH}|g" /tmp/release_body.md
          sed -i "s|@@BUILD_MODE@@|${BUILD_MODE}|g" /tmp/release_body.md
          sed -i "s|@@PATCH_COUNT@@|${PATCH_COUNT}|g" /tmp/release_body.md
          sed -i "s|@@REPO@@|${GITHUB_REPOSITORY}|g" /tmp/release_body.md
          sed -i "s|@@TARBALL_NAME@@|${TARBALL_NAME}|g" /tmp/release_body.md
          sed -i "s|@@SHA256@@|${SHA256}|g" /tmp/release_body.md
          # Replace changelog placeholder with actual content (escaping sed special chars)
          sed -i '/@@CHANGELOG_SECTION@@/{r /dev/stdin
            d}' /tmp/release_body.md <<< "$CHANGELOG_SECTION"
          # Remove leading whitespace from heredoc
          sed -i 's/^          //' /tmp/release_body.md

          gh release delete "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --yes 2>/dev/null || true
          git push --delete origin "$RELEASE_TAG" 2>/dev/null || true

          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Oronyx Clang $RELEASE_TAG" \
            --notes-file /tmp/release_body.md \
            --latest \
            "$TARBALL" \
            "${{ env.OUTPUT_DIR }}/clang-version.txt" \
            "get_latest_url.sh" \
            "latest.txt"

      # ── Commit metadata to repo ───────────────────────────────────────────────
      - name: Commit metadata files
        if: ${{ github.event.inputs.release == 'true' || github.event_name == 'repository_dispatch' || github.event_name == 'push' || github.event_name == 'schedule' }}
        run: |
          git config user.name "OronyxCI"
          git config user.email "OronyxCI@users.noreply.github.com"
          git add get_latest_url.sh latest.txt clang-version.txt
          git diff --cached --quiet || git commit -m "chore: update release metadata [skip ci]"
          git push --force-with-lease origin "${{ github.ref_name }}"

      # ── Notifications ────────────────────────────────────────────────────────
      # Note: failure notification is handled by build.sh cleanup trap
      # (which has access to build.log and error context)
      - name: Notify build success
        if: success()
        env:
          CLANG_VERSION: ${{ steps.package.outputs.CLANG_VERSION }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: bash scripts/notify.sh success

      - name: Notify release
        if: ${{ (github.event.inputs.release == 'true' || github.event_name == 'repository_dispatch') && success() }}
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
          TARBALL_NAME: ${{ steps.package.outputs.TARBALL_NAME }}
          PACKAGE_SIZE: ${{ env.PACKAGE_SIZE }}
          SHA256: ${{ env.SHA256 }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: bash scripts/notify.sh release

      - name: Notify changelog
        if: ${{ (github.event.inputs.release == 'true' || github.event_name == 'repository_dispatch') && success() }}
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
          CHANGELOG_FILE: /tmp/llvm_changelog.md
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: bash scripts/notify.sh changelog

      - name: Notify build failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [[ "${NOTIFIED_FAILURE:-false}" != "true" ]]; then
            bash scripts/notify.sh failure
            echo "NOTIFIED_FAILURE=true" >> "$GITHUB_ENV"
          fi
