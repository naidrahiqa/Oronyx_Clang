# Oronyx Clang Build Configuration
# Source this file or pass variables to build.sh

# Build preset: kernel, full, slim (overrides all settings below)
#   kernel  → optimized for kernel cross-compilation (PGO+BOLT, slimmed)
#   full    → complete LLVM toolchain, all targets, all features
#   slim    → lightweight, no PGO/BOLT, fast build
# Leave empty to use individual settings below
PRESET="${PRESET:-kernel}"

# LLVM branch or tag to build
# Supports: llvmorg-14.x.x through llvmorg-22.x.x, or 'main' for rolling
# Overridable via env (CI sets LLVM_BRANCH from .llvm-version or dispatch input)
LLVM_BRANCH="${LLVM_BRANCH:-llvmorg-22.1.8}"

# LLVM source repository
# upstream = https://github.com/llvm/llvm-project.git (mainline LLVM)
# android  = https://android.googlesource.com/toolchain/llvm-project (Android fork)
LLVM_SOURCE="upstream"

# Build optimizations
ENABLE_PGO="true"
ENABLE_BOLT="true"
PGO_WORKLOAD="kernel"           # sqlite (fast), kernel (accurate), llvm (compiler-focused)

# LTO mode: Thin, Full, or Off
LTO_MODE="Thin"

# Compression level for release tarballs (1-22)
ZSTD_LEVEL="19"

# Install directory (overridable via env — CI sets its own INSTALL_DIR)
INSTALL_DIR="${INSTALL_DIR:-$HOME/toolchains/oronyx}"

# Vendor string in clang version output
CLANG_VENDOR="Oronyx Clang"

# Default target triple
DEFAULT_TARGET_TRIPLE="aarch64-linux-android"
