# Samsung Exynos Device Presets
# Usage: kernel-build.sh <kernel-dir> --device=exynos990

# ── Exynos 990 (Galaxy S20/Note 20) ──────────────────────────────────────────
[exynos990]
DEFCONFIG="exynos990-perf_defconfig"
ARCH="arm64"
LTO_MODE="thin"
KCFLAGS="-Wno-address-of-packed-member"
TARGETS="AArch64"

# ── Exynos 9825 (Galaxy Note 10) ────────────────────────────────────────────
[exynos9825]
DEFCONFIG="exynos9825-perf_defconfig"
ARCH="arm64"
LTO_MODE="auto"
KCFLAGS="-Wno-address-of-packed-member"
TARGETS="AArch64"

# ── Exynos 9820 (Galaxy S10) ────────────────────────────────────────────────
[exynos9820]
DEFCONFIG="exynos9820-perf_defconfig"
ARCH="arm64"
LTO_MODE="auto"
KCFLAGS="-Wno-address-of-packed-member"
TARGETS="AArch64"

# ── Exynos 2100 (Galaxy S21) ────────────────────────────────────────────────
[exynos2100]
DEFCONFIG="exynos2100-perf_defconfig"
ARCH="arm64"
LTO_MODE="thin"
KCFLAGS=""
TARGETS="AArch64"

# ── Exynos 2200 (Galaxy S22) ────────────────────────────────────────────────
[exynos2200]
DEFCONFIG="exynos2200-perf_defconfig"
ARCH="arm64"
LTO_MODE="thin"
KCFLAGS=""
TARGETS="AArch64"

# ── Exynos 850 (Galaxy A series) ────────────────────────────────────────────
[exynos850]
DEFCONFIG="exynos850-perf_defconfig"
ARCH="arm64"
LTO_MODE="off"
KCFLAGS="-Wno-address-of-packed-member -Wno-unused-but-set-variable"
TARGETS="AArch64"

# ── Exynos 7904 (Galaxy M/A series) ─────────────────────────────────────────
[exynos7904]
DEFCONFIG="exynos7904-perf_defconfig"
ARCH="arm64"
LTO_MODE="off"
KCFLAGS="-Wno-address-of-packed-member -Wno-unused-but-set-variable -Wno-maybe-uninitialized"
TARGETS="AArch64"
