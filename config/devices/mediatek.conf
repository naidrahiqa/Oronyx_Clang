# MediaTek Device Presets
# Usage: kernel-build.sh <kernel-dir> --device=mt6893

# ── Dimensity 9000 (MT6983) ──────────────────────────────────────────────────
# Devices: OnePlus Ace 2V, Xiaomi 12T Pro, Realme GT Neo 5
[mt6983]
DEFCONFIG="vendor/mt6983-perf_defconfig"
ARCH="arm64"
LTO_MODE="thin"
KCFLAGS=""
TARGETS="AArch64"

# ── Dimensity 8100 (MT6895) ──────────────────────────────────────────────────
# Devices: Redmi Note 12 Turbo, Poco F4 GT, OnePlus Ace
[mt6895]
DEFCONFIG="vendor/mt6895-perf_defconfig"
ARCH="arm64"
LTO_MODE="thin"
KCFLAGS="-Wno-address-of-packed-member"
TARGETS="AArch64"

# ── Dimensity 920 (MT6877) ──────────────────────────────────────────────────
# Devices: Redmi Note 12 Pro, Realme 10 Pro+, Vivo V25
[mt6877]
DEFCONFIG="vendor/mt6877-perf_defconfig"
ARCH="arm64"
LTO_MODE="auto"
KCFLAGS="-Wno-address-of-packed-member"
TARGETS="AArch64"

# ── Helio G99 (MT6789) ──────────────────────────────────────────────────────
# Devices: Redmi 12, Galaxy A15, Poco M6 Pro
[mt6789]
DEFCONFIG="vendor/mt6789-perf_defconfig"
ARCH="arm64"
LTO_MODE="auto"
KCFLAGS="-Wno-address-of-packed-member -Wno-unused-but-set-variable"
TARGETS="AArch64"

# ── Helio G96 (MT6779) ──────────────────────────────────────────────────────
# Devices: Redmi Note 11 Pro, Realme 8s, Poco M4 Pro
[mt6779]
DEFCONFIG="vendor/mt6779-perf_defconfig"
ARCH="arm64"
LTO_MODE="auto"
KCFLAGS="-Wno-address-of-packed-member -Wno-unused-but-set-variable"
TARGETS="AArch64"

# ── Helio P60 (MT6771) ──────────────────────────────────────────────────────
# Devices: Oppo F7, Realme 1, Nokia 5.1 Plus
[mt6771]
DEFCONFIG="vendor/mt6771-perf_defconfig"
ARCH="arm64"
LTO_MODE="off"
KCFLAGS="-Wno-address-of-packed-member -Wno-unused-but-set-variable -Wno-maybe-uninitialized"
TARGETS="AArch64"

# ── Dimensity 700 (MT6833) ──────────────────────────────────────────────────
# Devices: Redmi 11 5G, Realme 8 5G, Samsung Galaxy A22 5G
[mt6833]
DEFCONFIG="vendor/mt6833-perf_defconfig"
ARCH="arm64"
LTO_MODE="auto"
KCFLAGS="-Wno-address-of-packed-member"
TARGETS="AArch64"

# ── Helio X30 (MT6797) ──────────────────────────────────────────────────────
# Devices: Meizu Pro 7, Helio X30 devices (kernel 4.x era)
[mt6797]
DEFCONFIG="vendor/mt6797-perf_defconfig"
ARCH="arm64"
LTO_MODE="off"
KCFLAGS="-Wno-address-of-packed-member -Wno-unused-but-set-variable -Wno-maybe-uninitialized -Wno-incompatible-pointer-types"
TARGETS="AArch64"
