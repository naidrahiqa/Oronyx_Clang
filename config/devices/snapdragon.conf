# Qualcomm Snapdragon Device Presets
# Usage: kernel-build.sh <kernel-dir> --device=sm8150

# ── SM8150 (Snapdragon 855) ──────────────────────────────────────────────────
# Devices: OnePlus 7/7T, Pixel 4/4XL, Galaxy S10, Redmi K20 Pro
[sm8150]
DEFCONFIG="vendor/sm8150-perf_defconfig"
ARCH="arm64"
LTO_MODE="thin"
KCFLAGS="-Wno-address-of-packed-member"
TARGETS="AArch64"

# ── SM8250 (Snapdragon 865) ──────────────────────────────────────────────────
# Devices: OnePlus 8/8T, Galaxy S20/S21, Pixel 5, Xiaomi Mi 10/11
[sm8250]
DEFCONFIG="vendor/sm8250-perf_defconfig"
ARCH="arm64"
LTO_MODE="thin"
KCFLAGS=""
TARGETS="AArch64"

# ── SM8350 (Snapdragon 888) ──────────────────────────────────────────────────
# Devices: OnePlus 9/9R, Galaxy S21/S22, Pixel 6, Xiaomi Mi 11
[sm8350]
DEFCONFIG="vendor/sm8350-perf_defconfig"
ARCH="arm64"
LTO_MODE="thin"
KCFLAGS=""
TARGETS="AArch64"

# ── SM8450 (Snapdragon 8 Gen 1) ─────────────────────────────────────────────
# Devices: OnePlus 10T, Galaxy S22/S23, Pixel 7, Xiaomi 12
[sm8450]
DEFCONFIG="vendor/sm8450-perf_defconfig"
ARCH="arm64"
LTO_MODE="thin"
KCFLAGS=""
TARGETS="AArch64"

# ── SM8550 (Snapdragon 8 Gen 2) ─────────────────────────────────────────────
# Devices: OnePlus 11, Galaxy S23/S24, Pixel 8, Xiaomi 13/14
[sm8550]
DEFCONFIG="vendor/sm8550-perf_defconfig"
ARCH="arm64"
LTO_MODE="thin"
KCFLAGS=""
TARGETS="AArch64"

# ── SM8650 (Snapdragon 8 Gen 3) ─────────────────────────────────────────────
# Devices: OnePlus 12, Galaxy S24/S25, Pixel 9, Xiaomi 14/15
[sm8650]
DEFCONFIG="vendor/sm8650-perf_defconfig"
ARCH="arm64"
LTO_MODE="thin"
KCFLAGS=""
TARGETS="AArch64"

# ── SM6150 (Snapdragon 675/730) ─────────────────────────────────────────────
# Devices: Redmi Note 7 Pro, Galaxy A50, Pixel 3a
[sm6150]
DEFCONFIG="vendor/sm6150-perf_defconfig"
ARCH="arm64"
LTO_MODE="auto"
KCFLAGS="-Wno-address-of-packed-member"
TARGETS="AArch64"

# ── SDM845 (Snapdragon 845) ─────────────────────────────────────────────────
# Devices: OnePlus 6/6T, Pixel 3/3XL, Galaxy S9
[sdm845]
DEFCONFIG="vendor/sdm845-perf_defconfig"
ARCH="arm64"
LTO_MODE="auto"
KCFLAGS="-Wno-address-of-packed-member -Wno-unused-but-set-variable"
TARGETS="AArch64"

# ── SDM710 (Snapdragon 710) ─────────────────────────────────────────────────
# Devices: Mi A2, Galaxy A8s, Nokia 7.1
[sdm710]
DEFCONFIG="vendor/sdm710-perf_defconfig"
ARCH="arm64"
LTO_MODE="auto"
KCFLAGS="-Wno-address-of-packed-member"
TARGETS="AArch64"

# ── MSM8998 (Snapdragon 835) ────────────────────────────────────────────────
# Devices: OnePlus 5/5T, Pixel 2/2XL, Galaxy S8
[msm8998]
DEFCONFIG="vendor/msm8998-perf_defconfig"
ARCH="arm64"
LTO_MODE="off"
KCFLAGS="-Wno-address-of-packed-member -Wno-unused-but-set-variable -Wno-maybe-uninitialized"
TARGETS="AArch64"

# ── MSM8996 (Snapdragon 820/821) ────────────────────────────────────────────
# Devices: OnePlus 3/3T, Pixel 1, Galaxy S7
[msm8996]
DEFCONFIG="vendor/msm8996-perf_defconfig"
ARCH="arm64"
LTO_MODE="off"
KCFLAGS="-Wno-address-of-packed-member -Wno-unused-but-set-variable -Wno-maybe-uninitialized -Wno-incompatible-pointer-types"
TARGETS="AArch64"
