# Oronyx Clang — Build Preset: full
# Complete LLVM toolchain with all targets and features.
# Use: PRESET=full bash scripts/build.sh

# ── Targets (all supported architectures) ─────────────────────────────────────
LLVM_TARGETS="AArch64;ARM;X86;RISCV;WebAssembly"

# ── Projects (full feature set) ──────────────────────────────────────────────
LLVM_PROJECTS="clang;lld;compiler-rt;polly;clang-tools-extra"

# ── Runtimes ─────────────────────────────────────────────────────────────────
LLVM_RUNTIMES="libcxx;libcxxabi"

# ── Optimizations ────────────────────────────────────────────────────────────
ENABLE_PGO="true"
PGO_WORKLOAD="llvm"             # Train on LLVM self-build for general compiler perf
ENABLE_BOLT="true"
LTO_MODE="Full"

# ── Compression ──────────────────────────────────────────────────────────────
ZSTD_LEVEL="10"

# ── Post-build steps ─────────────────────────────────────────────────────────
SLIM_TOOLCHAIN="false"
CLANG_VENDOR="Oronyx Clang"
DEFAULT_TARGET_TRIPLE="aarch64-linux-android"