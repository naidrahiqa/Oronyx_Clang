# Oronyx Clang — Build Preset: kernel
# Optimized for Android kernel cross-compilation: minimal size, maximum speed.
# Use: PRESET=kernel bash scripts/build.sh

# ── Targets (only what's needed for kernel) ──────────────────────────────────
LLVM_TARGETS="AArch64;ARM"

# ── Projects (minimal set) ───────────────────────────────────────────────────
LLVM_PROJECTS="clang;lld;compiler-rt"

# ── Runtimes ─────────────────────────────────────────────────────────────────
LLVM_RUNTIMES="libcxx;libcxxabi"

# ── Optimizations ────────────────────────────────────────────────────────────
ENABLE_PGO="true"
PGO_WORKLOAD="kernel"           # Train on real kernel build for best kernel perf
ENABLE_BOLT="true"
LTO_MODE="Thin"

# ── Compression ──────────────────────────────────────────────────────────────
ZSTD_LEVEL="19"

# ── Post-build steps ─────────────────────────────────────────────────────────
SLIM_TOOLCHAIN="true"          # Strip + remove unused bins/docs
SLIM_AGGRESSIVE="true"         # Also remove .a files, headers, cmake
CLANG_VENDOR="Oronyx Clang"
DEFAULT_TARGET_TRIPLE="aarch64-linux-android"