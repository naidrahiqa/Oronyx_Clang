# Oronyx Clang — Build Preset: slim
# Lightweight build with moderate optimizations, no PGO/BOLT, fast compilation.
# Use: PRESET=slim bash scripts/build.sh

# ── Targets ──────────────────────────────────────────────────────────────────
LLVM_TARGETS="AArch64;ARM"

# ── Projects ─────────────────────────────────────────────────────────────────
LLVM_PROJECTS="clang;lld"

# ── Runtimes ─────────────────────────────────────────────────────────────────
LLVM_RUNTIMES=""

# ── Optimizations (none — pure LLVM, minimal build time) ─────────────────────
ENABLE_PGO="false"
ENABLE_BOLT="false"
LTO_MODE="Off"

# ── Compression ──────────────────────────────────────────────────────────────
ZSTD_LEVEL="19"

# ── Post-build steps ─────────────────────────────────────────────────────────
SLIM_TOOLCHAIN="true"
SLIM_AGGRESSIVE="true"
CLANG_VENDOR="Oronyx Clang"
DEFAULT_TARGET_TRIPLE="aarch64-linux-android"